<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Info</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="login-container">
        <div class="SignUp-box" id="SignUp-box">
            <p>Ready to start your weather info journey</p>
            <h2>Sign up to Weather Info</h2>
            <!-- ✅ Added id="signupForm" -->
            <form id="signupForm" method="post">
                <!-- ✅ Added proper name attributes -->
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <input type="tel" id="phone" name="phone" placeholder="Phone Number" required />
                <input type="email" id="email" name="email" placeholder="Email" required />
                <input type="password" id="password" name="password" placeholder="Password" required />
                <a href="#" class="forgot">Forgot password?</a>
                <button type="submit">Get Started</button>
            </form>

            <div class="social-SignUp">
                <span>Or sign up with</span>
                <div class="social-icons">
                    <a href="https://accounts.google.com">
                        <img src="google-icon.png" alt="Google" title="Google" />
                    </a>
                    <a href="https://accounts.facebook.com">
                        <img src="facebook-icon.png" alt="Facebook" title="Facebook" />
                    </a>
                    <a href="https://accounts.apple.com">
                        <img src="apple-icon.png" alt="Apple" title="Apple" />
                    </a>
                </div>
            </div>
            <div class="toggle-link">
                <p>Have an account? <a href="#" id="signInToggle">Sign In</a></p>
            </div>
        </div>

        <div class="SignIn-box" id="signInBox" style="display: none;">
            <p>Welcome back to your weather info journey</p>
            <h2>Sign in to Weather Info</h2>
            <form id="signinForm" method="post" action="#">
                <input type="text" id="identifier" name="identifier" placeholder="Enter your email or phone number"
                    required>
                <input type="password" id="signinPassword" name="password" placeholder="Password" required />
                <a href="#" class="forgot">Forgot password?</a>
                <button type="submit">Sign In</button>
            </form>
            <div class="social-SignIn">
                <span>Or sign in with</span>
                <div class="social-icons">
                    <a href="https://accounts.google.com">
                        <img src="google-icon.png" alt="Google" title="Google" />
                    </a>
                    <a href="https://accounts.facebook.com">
                        <img src="facebook-icon.png" alt="Facebook" title="Facebook" />
                    </a>
                    <a href="https://accounts.apple.com">
                        <img src="apple-icon.png" alt="Apple" title="Apple" />
                    </a>
                </div>
            </div>
            <div class="toggle-link">
                <p>Don't have an account? <a href="#" id="signUpToggle">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const signInToggle = document.getElementById('signInToggle');
            const signUpToggle = document.getElementById('signUpToggle');
            const signInBox = document.getElementById('signInBox');
            const signUpBox = document.getElementById('SignUp-box');
            const signupForm = document.getElementById('signupForm'); // ✅ Added
            const signinForm = document.getElementById('signinForm'); // ✅ Added

            // Initial state
            signUpBox.style.display = 'block';
            signInBox.style.display = 'none';

            // Toggle to Sign In
            if (signInToggle) {
                signInToggle.addEventListener('click', function (e) {
                    e.preventDefault();
                    signUpBox.style.display = 'none';
                    signInBox.style.display = 'block';
                    signInBox.classList.add('show');
                });
            }

            // Toggle to Sign Up
            if (signUpToggle) {
                signUpToggle.addEventListener('click', function (e) {
                    e.preventDefault();
                    signInBox.classList.remove('show');
                    setTimeout(() => {
                        signInBox.style.display = 'none';
                        signUpBox.style.display = 'block';
                    }, 300);
                });
            }

            // ✅ Handle signup form submission
            signupForm.addEventListener('submit', async function (e) {
                e.preventDefault(); // stop normal form behavior

                const formData = new FormData(signupForm);
                const submitButton = signupForm.querySelector('button[type="submit"]');
                
                // Disable button during submission
                submitButton.disabled = true;
                submitButton.textContent = "Creating Account...";

                try {
                    // change the URL below to match your FastAPI backend
                    const response = await fetch("http://127.0.0.1:8000/signup", {
                        method: "POST",
                        body: formData,
                        headers: {
                            'Accept': 'application/json',
                        }
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // alert("✅ Sign-up successful! User ID: " + data.user_id);
                        signupForm.reset();
                        // Redirect to weather page after successful signup with user_id
                        setTimeout(() => {
                            window.location.href = `index_weather.html?user_id=${data.user_id}`;
                        }, 1000);
                    } else {
                        // alert("❌ Error: " + (data.detail || "Something went wrong."));
                    }
                } catch (error) {
                    // alert("⚠️ Unable to connect to backend. Make sure FastAPI is running on http://127.0.0.1:8000");
                    console.error("Connection error:", error);
                } finally {
                    // Re-enable button
                    submitButton.disabled = false;
                    submitButton.textContent = "Get Started";
                }
            });

            // ✅ Handle signin form submission
            signinForm.addEventListener('submit', async function (e) {
                e.preventDefault(); // stop normal form behavior

                const formData = new FormData(signinForm);
                const submitButton = signinForm.querySelector('button[type="submit"]');
                
                // Disable button during submission
                submitButton.disabled = true;
                submitButton.textContent = "Signing In...";

                try {
                    const response = await fetch("http://127.0.0.1:8000/signin", {
                        method: "POST",
                        body: formData,
                        headers: {
                            'Accept': 'application/json',
                        }
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // alert("✅ Sign-in successful! Welcome back!");
                        signinForm.reset();
                        // Redirect to weather page after successful signin with user_id
                        setTimeout(() => {
                            window.location.href = `index_weather.html?user_id=${data.user_id}`;
                        }, 1000);
                    } else {
                        // alert("❌ Error: " + (data.detail || "Invalid credentials."));
                    }
                } catch (error) {
                    // alert("⚠️ Unable to connect to backend. Make sure FastAPI is running on http://127.0.0.1:8000");
                    console.error("Connection error:", error);
                } finally {
                    // Re-enable button
                    submitButton.disabled = false;
                    submitButton.textContent = "Sign In";
                }
            });
        });
    </script>

</body>

</html>
